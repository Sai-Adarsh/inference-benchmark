[package]
name = "inference-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
csv = "1"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "point_series"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
